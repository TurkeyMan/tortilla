name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Every toolkit backend, and the tests; then the .deb packages.
  linux:
    name: debian ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: 'debian:trixie'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      # Before checkout, so it has git and the container has everything else.
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      # rapport's URL is SSH; with no SSH key given, checkout fetches
      # submodules over HTTPS with the job's token. The whole history:
      # untagged packages are versioned by commit count.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install library dependencies
        run: .github/ci/deps-debian.sh

      - name: Build and test
        run: .github/ci/build.sh

      - name: Package
        run: .github/ci/package.sh DEB

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-debian-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # The same on Fedora, for the .rpm packages.
  fedora:
    name: fedora ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: 'fedora:44'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      - name: Install build dependencies
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install library dependencies
        run: .github/ci/deps-fedora.sh

      - name: Build and test
        run: .github/ci/build.sh

      - name: Package
        run: .github/ci/package.sh RPM

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-fedora-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  # The Arch packages, built and tested by makepkg from packaging/arch. The
  # archlinux image is x86_64 only.
  arch:
    name: arch x86_64
    runs-on: ubuntu-24.04
    container: 'archlinux:latest'
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build, test and package
        run: .github/ci/package-arch.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # MSVC with the static runtime and static libraries: a self-contained
  # tortilla.exe and the Explorer extension, as a zip and an NSIS installer
  # that registers the extension.
  windows:
    name: windows x86_64
    runs-on: windows-2022
    steps:
      # rapport's URL is SSH; with no SSH key given, checkout fetches
      # submodules over HTTPS with the job's token.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: vcpkg
        id: vcpkg
        uses: ./rapport/.github/actions/vcpkg
        with:
          triplet: x64-windows-static

      # Configuring builds the vcpkg ports; they're saved before anything
      # later can fail and lose them.
      - name: Configure
        run: .github/ci/build-windows.ps1 -ConfigureOnly

      - uses: actions/cache/save@v4
        if: always() && steps.vcpkg.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: ${{ steps.vcpkg.outputs.cache-key }}

      - name: Build, test and package
        run: .github/ci/build-windows.ps1

      - name: Upload installer and zip
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-windows-x86_64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # A pushed tag (v0.1, v0.2-beta, ...) becomes a GitHub release carrying the
  # Windows installer and zip, and the Linux packages.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, fedora, arch, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "Tortilla ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag $prerelease
