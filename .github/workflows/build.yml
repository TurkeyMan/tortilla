name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Every toolkit backend, and the tests; then the .deb package.
  linux:
    name: debian ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: 'debian:trixie'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      # Before checkout, so it has git and the container has everything else.
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      # rapport's URL is SSH; with no SSH key given, checkout fetches
      # submodules over HTTPS with the job's token. The whole history:
      # untagged packages are versioned by commit count.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install library dependencies
        run: .github/ci/deps-debian.sh

      - name: Build and test
        run: .github/ci/build.sh

      - name: Package
        run: .github/ci/package.sh DEB

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-debian-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # The same on Fedora, for the .rpm package.
  fedora:
    name: fedora ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: 'fedora:44'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    steps:
      - name: Install build dependencies
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install library dependencies
        run: .github/ci/deps-fedora.sh

      - name: Build and test
        run: .github/ci/build.sh

      - name: Package
        run: .github/ci/package.sh RPM

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-fedora-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  # The Arch package, built and tested by makepkg from packaging/arch.
  arch:
    name: arch x86_64
    runs-on: ubuntu-24.04
    container: 'archlinux:latest'
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build, test and package
        run: .github/ci/package-arch.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # The same on Arch Linux ARM, which has no image of its own: one is made
  # from its root filesystem, as Arch Linux ARM publishes it.
  arch-arm64:
    name: arch arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Arch Linux ARM image
        run: |
          base=http://os.archlinuxarm.org/os
          curl -fsSL -o alarm.tar.gz "$base/ArchLinuxARM-aarch64-latest.tar.gz"
          curl -fsSL -o alarm.tar.gz.md5 "$base/ArchLinuxARM-aarch64-latest.tar.gz.md5"
          echo "$(cut -d' ' -f1 alarm.tar.gz.md5)  alarm.tar.gz" | md5sum -c -
          docker import alarm.tar.gz alarm
          rm alarm.tar.gz alarm.tar.gz.md5

      # The kernel and firmware are no use in a container, and the kernel's
      # upgrade would build an initramfs. pacman can't tell a container's
      # free space, or sandbox its downloads there (Landlock is refused).
      - name: Build, test and package
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_REF alarm sh -c '
            set -eu
            sed -i "s/^CheckSpace/#CheckSpace/; /^\[options\]/a DisableSandbox" /etc/pacman.conf
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Rdd --noconfirm linux-aarch64 linux-firmware 2>/dev/null || true
            .github/ci/package-arch.sh'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-arch-arm64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # MSVC with the static runtime and static libraries: a self-contained
  # tortilla.exe and the Explorer extension, as a zip and an NSIS installer
  # that registers the extension.
  windows:
    name: windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2022,  triplet: x64-windows-static }
          - { arch: arm64,  runner: windows-11-arm, triplet: arm64-windows-static }
    steps:
      # rapport's URL is SSH; with no SSH key given, checkout fetches
      # submodules over HTTPS with the job's token.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: vcpkg
        id: vcpkg
        uses: ./rapport/.github/actions/vcpkg
        with:
          triplet: ${{ matrix.triplet }}

      # Configuring builds the vcpkg ports; they're saved before anything
      # later can fail and lose them.
      - name: Configure
        run: .github/ci/build-windows.ps1 -Arch ${{ matrix.arch }} -ConfigureOnly

      - uses: actions/cache/save@v4
        if: always() && steps.vcpkg.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.vcpkg.outputs.cache }}
          key: ${{ steps.vcpkg.outputs.cache-key }}

      - name: Build, test and package
        run: .github/ci/build-windows.ps1 -Arch ${{ matrix.arch }}

      - name: Upload installer and zip
        uses: actions/upload-artifact@v4
        with:
          name: tortilla-windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # A pushed tag (v0.1.0, v0.2.0-beta, ...) becomes the latest GitHub release:
  # the Windows installers and zips, and one package per Linux distribution.
  # Short notes, so the downloads are near the top of the page.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, fedora, arch, arch-arm64, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          v=${GITHUB_REF_NAME#v}
          # Every download the notes name, and nothing else: two jobs writing
          # one name would leave one file, silently.
          expected=
          for a in x86_64 arm64; do
            expected="$expected tortilla-$v-windows-$a-setup.exe tortilla-$v-windows-$a.zip"
            expected="$expected tortilla-$v-debian-$a.deb tortilla-$v-fedora-$a.rpm"
            expected="$expected tortilla-$v-arch-$a.pkg.tar.zst"
          done
          for f in $expected; do
            [ -f "dist/$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
          [ "$(ls dist | wc -l)" -eq 10 ] || { echo "::error::Expected 10 files in dist"; exit 1; }
          sed "s/@VERSION@/$v/g; s|@COMMITS@|https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME|g" \
            .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "Tortilla $v" \
            --notes-file notes.md --verify-tag --latest
